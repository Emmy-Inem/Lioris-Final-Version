name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA (the tag is kept as a trailing
# comment). Dependabot's github-actions ecosystem keeps the pins up to date.

jobs:
  validate:
    name: Typecheck, Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22.18+ runs the TypeScript unit tests natively (type stripping).
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install SQL migration harness
        run: npm ci --prefix tools/sql-harness

      - name: Supabase migration and RLS regression tests
        run: npm test --prefix tools/sql-harness

      # Fails on high/critical advisories in production dependencies. If a future
      # advisory is only fixable in dev-tool-only transitive packages, lower this to
      # --audit-level=critical with a comment explaining which advisory and why.
      - name: Dependency Security Audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Web Bundle Production Export
        run: npx expo export --platform web
        env:
          APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://fdtnbluslkabwsmspbem.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TB0Pw8k2oJQTmoO951YaIQ_xzOyGpZF

      - name: Fail if the web bundle contains secrets or direct Gemini calls
        run: |
          set -u
          fail=0
          if grep -rIl --include='*' 'generativelanguage.googleapis.com' dist; then
            echo "::error::dist contains generativelanguage.googleapis.com (the Gemini call must go through the gemini-proxy edge function)."
            fail=1
          fi
          if grep -rIlE 'AIza[0-9A-Za-z_-]{20,}' dist; then
            echo "::error::dist contains a Google API key pattern (AIza...)."
            fail=1
          fi
          if grep -rIl 'service_role' dist; then
            echo "::error::dist contains the string 'service_role'."
            fail=1
          fi
          exit $fail

      # The exact bundle that passed the checks above is reused by the e2e job.
      - name: Upload web build (dist)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: Playwright E2E (smoke + accessibility)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download web build (dist)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (with system dependencies)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # On a cache hit the browser binary is restored, but the OS libraries still need installing.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: npm run e2e:ci
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation repositories additionally need a GITLEAKS_LICENSE secret.
