name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TODO: pin every third-party action below to a full commit SHA (major version tags are
# used because SHAs could not be verified offline). Dependabot's github-actions
# ecosystem keeps pinned SHAs up to date once they are pinned.

jobs:
  validate:
    name: Typecheck, Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.18+ runs the TypeScript unit tests natively (type stripping).
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Fails on high/critical advisories in production dependencies. If a future
      # advisory is only fixable in dev-tool-only transitive packages, lower this to
      # --audit-level=critical with a comment explaining which advisory and why.
      - name: Dependency Security Audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Web Bundle Production Export
        run: npx expo export --platform web
        env:
          APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://fdtnbluslkabwsmspbem.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TB0Pw8k2oJQTmoO951YaIQ_xzOyGpZF

      - name: Fail if the web bundle contains secrets or direct Gemini calls
        run: |
          set -u
          fail=0
          if grep -rIl --include='*' 'generativelanguage.googleapis.com' dist; then
            echo "::error::dist contains generativelanguage.googleapis.com (the Gemini call must go through the gemini-proxy edge function)."
            fail=1
          fi
          if grep -rIlE 'AIza[0-9A-Za-z_-]{20,}' dist; then
            echo "::error::dist contains a Google API key pattern (AIza...)."
            fail=1
          fi
          if grep -rIl 'service_role' dist; then
            echo "::error::dist contains the string 'service_role'."
            fail=1
          fi
          exit $fail

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation repositories additionally need a GITLEAKS_LICENSE secret.
