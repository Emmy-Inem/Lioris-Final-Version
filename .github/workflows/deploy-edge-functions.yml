name: Deploy Edge Functions

# Deploys every Supabase edge function with scripts/deploy-supabase.sh (verify-jwt policy read from supabase/config.toml,
# required secret NAMES checked, smoke requests afterwards). Runs when function code changes on main, or by hand from the
# Actions tab ("Run workflow"; tick dry-run to only check). It does nothing, and does not fail, until the repository secret
# SUPABASE_ACCESS_TOKEN exists (Supabase dashboard > Account > Access Tokens > Generate new token; then GitHub >
# Settings > Secrets and variables > Actions > New repository secret). Function secrets (CRON_SECRET, GEMINI_API_KEY, ...)
# live in Supabase (Edge Functions > Secrets); the script lists any that are missing.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-supabase.sh'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check (login, secret names); print the deploy commands without running them'
        type: boolean
        default: false
      only:
        description: 'Comma-separated function names (empty = all)'
        type: string
        default: ''

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Edge functions not deployed::Add the repository secret SUPABASE_ACCESS_TOKEN to enable automatic deploys (see the comment at the top of this workflow)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          bash scripts/deploy-supabase.sh "${args[@]}"
