name: Continuous Deployment

on:
  push:
    branches: [main]          # Web deploy + mobile OTA update on every merge to main
  workflow_dispatch:
    inputs:
      mobile_release:
        description: 'Optional mobile action (must be explicitly selected)'
        required: true
        default: none
        type: choice
        options:
          - none
          - ota
          - build
          - build-and-submit

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a deploy mid-flight

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Web: deploy to Vercel (production)
# Runs only on pushes to main. Vercel CLI is used directly so we have full
# control over the deploy and can surface its URL in the job summary.
# Requires repository secret: VERCEL_TOKEN
# Requires Vercel env vars already set in vercel.json (they are).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  deploy-web:
    name: Deploy Web → Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Export web bundle (production)
        run: npx expo export --platform web --clear
        env:
          APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy to Vercel (production)
        id: vercel-deploy
        run: |
          DEPLOY_URL=$(npx vercel --prod \
            --token "$VERCEL_TOKEN" \
            --yes \
            2>&1 | tail -n1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### Web Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Mobile OTA: Expo Updates publish to the production channel
# Every push to main publishes the new JavaScript to installed Android/iOS apps that were built with expo-updates
# and carry the same runtime version (`version` in app.config.ts). It runs only after the web deploy succeeded and
# after typecheck, unit tests and the native runtime guard pass on the exact commit being published. Native changes
# cannot travel over the air: the guard fails until `version` is bumped and a new store build is made.
# Can also be started by hand (mobile_release = ota). Requires repository secret: EXPO_TOKEN
# See docs/operations/mobile-releases.md.
# ─────────────────────────────────────────────────────────────────────────────
  publish-ota:
    name: Publish OTA Update → Expo (production channel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-web
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mobile_release == 'ota'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Native runtime guard (OTA safety)
        run: npm run native-runtime

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Publish Expo update (production channel)
        run: |
          set -euo pipefail
          # Installed apps ask the "production" channel (eas.json + app.config.ts). Create it, and the branch it
          # follows, the first time; afterwards this is a no-op.
          eas channel:view production --non-interactive > /dev/null 2>&1 || eas channel:create production --non-interactive
          MESSAGE="OTA ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          eas update --branch production --environment production --message "$MESSAGE" --non-interactive
          echo "### OTA Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Channel:** production" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Message:** $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: production
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Mobile Native: EAS production build + store submission
# Triggered only by an explicit manual build or build-and-submit selection.
# A build does not upload to either store unless build-and-submit was selected.
# Requires repository secrets: EXPO_TOKEN, APPLE_APP_SPECIFIC_PASSWORD (for ASC),
#   and Google Play JSON key configured in EAS submit settings.
# ─────────────────────────────────────────────────────────────────────────────
  build-native:
    name: EAS Production Build + Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mobile_release == 'build' || inputs.mobile_release == 'build-and-submit')
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build ${{ matrix.platform }} (production profile)
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --wait
          echo "### Native Build — ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform:** ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ref:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Build submitted to EAS — check https://expo.dev for progress" >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit ${{ matrix.platform }} to store
        if: inputs.mobile_release == 'build-and-submit'
        run: |
          eas submit \
            --platform ${{ matrix.platform }} \
            --profile production \
            --latest \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
