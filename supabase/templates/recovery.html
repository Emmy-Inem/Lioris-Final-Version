<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Lioris password</title>
  </head>
  <body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033">
    <div style="max-width:560px;margin:0 auto;padding:32px 16px">
      <div style="background:#ffffff;border:1px solid #e3e8f0;border-radius:18px;padding:32px">
        <div style="font-size:22px;font-weight:700;color:#175cd3;margin-bottom:20px">Lioris</div>
        <h1 style="font-size:24px;line-height:32px;margin:0 0 12px">Reset your password</h1>
        <p style="font-size:15px;line-height:23px;margin:0 0 22px;color:#475467">
          Use the secure button below to return to Lioris and choose the new password you want.
        </p>
        <p style="margin:0 0 24px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#175cd3;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:999px">Choose a new password</a>
        </p>
        <div style="border-top:1px solid #e3e8f0;padding-top:20px">
          <p style="font-size:13px;line-height:20px;margin:0 0 8px;color:#667085">Prefer to enter a code in the app?</p>
          <div style="font-size:28px;letter-spacing:8px;font-weight:700;color:#172033">{{ .Token }}</div>
          <p style="font-size:12px;line-height:18px;margin:12px 0 0;color:#667085">This code and link expire. If you did not request this reset, you can ignore this email.</p>
        </div>
      </div>
    </div>
  </body>
</html>
