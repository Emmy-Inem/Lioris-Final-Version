# PARTIAL Supabase CLI config. DO NOT run `supabase config push` with this file.
#
# This file records ONLY two things for the hosted project:
#   1. the per-function `verify_jwt` policy (the [functions.*] blocks at the bottom), so
#      `supabase functions deploy` is reproducible, and
#   2. the INTENT of the server-side Auth rate limits and e-mail OTP settings below.
#
# It is NOT a full `supabase init` file and does not describe the live Auth configuration.
# `supabase config push` would write every section of the project's config from this file and fill
# the sections it does not contain with CLI defaults, which can silently reset e-mail
# confirmation, captcha, redirect URLs, password rules and MFA on the production project.
# Apply the values below by hand in the Supabase Dashboard (Authentication) instead.
#
# Dashboard settings that must be checked MANUALLY (they are deliberately not recorded here):
#   * Authentication > URL Configuration: site_url is the production https origin, and the
#     redirect URL allow-list has no localhost / wildcard entries.
#   * Authentication > Providers > Email: "Confirm email" (enable_confirmations) = ON.
#   * Authentication > Policies / Password: minimum password length >= 8.
#   * Authentication > Attack Protection: CAPTCHA protection ON (and the matching site key in the app).
#   * Authentication > Multi-Factor: TOTP enrolment/verification enabled as the app expects.
#   * Authentication > Email: OTP length (6) and OTP expiry (3600 s), matching [auth.email] below.
#   * Authentication > Sessions: refresh token rotation ON with reuse detection.
# See docs/security/deploy.md.

project_id = "fdtnbluslkabwsmspbem"

# Server-side (GoTrue) rate limits - login/password-reset/OTP all go straight from
# the client to Supabase Auth with no edge function in front of them, so the
# app's own client-side rate limiting (src/utils/authRateLimit.ts) is trivially
# bypassed by clearing localStorage, a private window, or calling the API
# directly. These limits are enforced by the hosted Supabase project itself.
# NOTE: this file alone does not change the live project and must NOT be pushed with
# `supabase config push`; mirror these values by hand in the Supabase Dashboard under
# Authentication > Rate Limits.
[auth.rate_limit]
# Sign-in/sign-up requests per 5-minute window, per IP (Supabase default: 30).
sign_in_sign_ups = 30
# Outgoing auth e-mails (confirmation, recovery, invite, magic link, e-mail change) per HOUR,
# counted PROJECT-WIDE - not per IP. It is a cap on how much auth mail the project may send at
# all (Supabase default: 2 - raised so legitimate retries are not blocked). It is shared with
# admin-create-user, whose invite e-mail (resetPasswordForEmail) spends from the same budget:
# creating many accounts in one hour can exhaust it and make real users' password-reset e-mails
# fail until the hour rolls over. Size it for (expected recoveries + admin invites) per hour; with
# a custom SMTP provider this cap is configurable in the Dashboard.
email_sent = 10
# OTP/magic-link verifications per 5-minute window, per IP (Supabase default: 30).
token_verifications = 30
# Session refreshes per 5-minute window, per IP (Supabase default: 150).
token_refresh = 150

[auth.email]
# All confirmation and recovery screens use a six-digit code.
otp_length = 6
otp_expiry = 3600

# Local Auth mirror of the hosted recovery template. The hosted project must use
# the same HTML under Authentication > Email Templates > Reset password.
[auth.email.template.recovery]
subject = "Reset your Lioris password"
content_path = "./supabase/templates/recovery.html"

# --- verify_jwt = true: the Supabase gateway rejects requests without a valid user JWT ---

[functions.gemini-proxy]
verify_jwt = true

[functions.support-ai-chat]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true

[functions.admin-impersonate-user]
verify_jwt = true

[functions.admin-create-user]
verify_jwt = true

[functions.admin-force-signout]
verify_jwt = true

[functions.admin-manage-institution]
verify_jwt = true

[functions.admin-review-paid-event]
verify_jwt = true

[functions.admin-review-giving-campaign]
verify_jwt = true

[functions.delete-my-account]
verify_jwt = true

[functions.turn-credentials]
verify_jwt = true

# --- verify_jwt = false: public data, machine-to-machine (shared-secret header) or pre-login ---

[functions.overpass-proxy]
verify_jwt = false

[functions.purge-expired-verification-documents]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.report-client-error]
verify_jwt = false

# Pre-login by definition. Rate limited per IP and per handle inside the function.
[functions.login-with-username]
verify_jwt = false
