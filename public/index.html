<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--
      HTML shell for the web build. Expo uses this file as the template for the single-page export
      (`web.output` is not "static", so app/+html.tsx is NOT applied); it injects the script and
      favicon.ico tags itself, and fills in the html lang attribute.

      DOMAIN: the absolute URLs below (og:url, og:image, twitter:*) must be the PUBLIC site URL,
      because Facebook, WhatsApp, X and iMessage crawlers require absolute image URLs. When the
      production domain changes, replace every https://lioris-final-version.vercel.app in this file
      (see docs/launch/launch-checklist.md).
    -->
    <title>Lioris | The Unified Campus Network</title>
    <meta name="title" content="Lioris | The Unified Campus Network" />
    <meta
      name="description"
      content="Connect with verified university students and alumni. Access course past questions, academic forums, campus events, and career mentorship."
    />
    <meta name="theme-color" content="#080E1A" />

    <!-- Open Graph: Facebook, WhatsApp, Telegram, iMessage, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lioris-final-version.vercel.app" />
    <meta property="og:site_name" content="Lioris" />
    <meta property="og:title" content="Lioris | The Unified Campus Network" />
    <meta
      property="og:description"
      content="Connect with verified university students and alumni. Access course past questions, academic forums, campus events, and career mentorship."
    />
    <meta property="og:image" content="https://lioris-final-version.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lioris logo on a dark blue background" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lioris | The Unified Campus Network" />
    <meta
      name="twitter:description"
      content="Connect with verified university students and alumni. Access course past questions, academic forums, campus events, and career mentorship."
    />
    <meta name="twitter:image" content="https://lioris-final-version.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Lioris logo on a dark blue background" />

    <!-- Icons, home-screen icon and Web App Manifest (built by tools/brand/build-brand-assets.cjs) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
