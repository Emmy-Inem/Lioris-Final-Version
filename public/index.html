<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>Lioris | The Unified Campus Network</title>
    <meta
      name="description"
      content="Connect with verified university students and alumni. Access course materials, academic forums, campus events, and career mentorship."
    />
    <meta name="theme-color" content="#080E1A" />
    <link rel="canonical" href="https://lioris-campus.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lioris" />
    <meta property="og:url" content="https://lioris-campus.vercel.app/" />
    <meta property="og:title" content="Lioris | The Unified Campus Network" />
    <meta
      property="og:description"
      content="Connect with verified university students and alumni. Access course materials, academic forums, campus events, and career mentorship."
    />
    <meta property="og:image" content="https://lioris-campus.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lioris logo on a dark blue background" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lioris-campus.vercel.app/" />
    <meta name="twitter:title" content="Lioris | The Unified Campus Network" />
    <meta
      name="twitter:description"
      content="Connect with verified university students and alumni. Access course materials, academic forums, campus events, and career mentorship."
    />
    <meta name="twitter:image" content="https://lioris-campus.vercel.app/og-image.jpg" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lioris" />
    <meta name="color-scheme" content="light dark" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* Never let the browser's default white show while the app (re)loads, e.g. when a
           minimized PWA is brought back and has to boot again. */
        background-color: #f8faf9;
        /* The app implements its own pull-to-refresh; stop the browser's native one from
           fighting it or reloading the page under the user. */
        overscroll-behavior-y: none;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Splash shown only while React has not mounted yet (#root is empty until then). */
      #root:empty::after {
        content: '';
        flex: 1;
        background: url('/icon-192.png') center / 96px 96px no-repeat;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1120;
        }
      }
    </style>
    <script src="/pwa-boot.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Lioris.</noscript>
    <div id="root"></div>
  </body>
</html>
